# nfpm configuration for building Fedora/RHEL .rpm and Debian/Ubuntu .deb packages.
#
#   wails build -tags webkit2_41
#   nfpm package -f build/linux/nfpm/nfpm.yaml -p rpm
#   nfpm package -f build/linux/nfpm/nfpm.yaml -p deb
#
# Docs: https://nfpm.goreleaser.com/configuration/
name: road-todo
arch: amd64
platform: linux
version: 1.0.0
section: default
priority: optional
maintainer: stevegpa <steven.gpa.git@gmail.com>
description: |
  A local-first roadmap and todo board for the desktop.
  Built with Go, Wails and Angular. All data is stored locally in SQLite.
vendor: road-todo
license: MIT

# Dependency names differ between RPM and DEB; the defaults below target RPM and
# the "overrides" block rewrites them for DEB.
depends:
  - gtk3
  - webkit2gtk4.1

overrides:
  deb:
    depends:
      - libgtk-3-0
      - libwebkit2gtk-4.1-0

contents:
  - src: build/bin/road-todo
    dst: /usr/bin/road-todo
    file_info:
      mode: 0755
  - src: build/appicon.png
    dst: /usr/share/icons/hicolor/512x512/apps/road-todo.png
  - src: build/linux/road-todo.desktop
    dst: /usr/share/applications/road-todo.desktop

rpm:
  group: Applications/Productivity
